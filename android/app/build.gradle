plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.bytebuddy.kharchaaa'
    compileSdk 34

    defaultConfig {
        applicationId 'com.bytebuddy.kharchaaa'
        minSdk 24
        targetSdk 34
        // Original APK v1.9 had versionCode 10 — v3.0 is 10 + 1.
        versionCode 11
        versionName '3.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
